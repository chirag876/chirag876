name: 🔄 Weekly README Update

on:
  schedule:
    # Every Monday at 06:00 UTC (11:30 AM IST) — once a week
    - cron: "0 6 * * 1"
  workflow_dispatch: # allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ▶️ Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          README_PATH: README.md
        run: python scripts/generate_readme.py

      - name: 📝 Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes to commit." || \
            (git commit -m "chore: auto-update README [$(date -u '+%d %b %Y')]" && git push)
